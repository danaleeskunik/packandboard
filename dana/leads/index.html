<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17352A">
<title>Pack &amp; Board</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;800&family=Miriam+Libre:wght@700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{--bg:#F7F2E8;--card:#fff;--line:#E2D9C4;--ink:#1F2A24;--ink2:#6b776f;--brand:#17352A;--amber:#D49A3A;--blue:#2F7FC8;--btn:#17352A;--btnink:#F7F2E8;--shadow:0 1px 2px rgba(23,53,42,.06),0 8px 24px rgba(23,53,42,.07)}
@media(prefers-color-scheme:dark){:root{--blue:#5FA8E8;--bg:#101a15;--card:#1a2a22;--line:#2b3f34;--ink:#eef2ec;--ink2:#9fb0a5;--brand:#cfe6d8;--btn:#cfe6d8;--btnink:#101a15;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:34px 20px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
.logo{direction:ltr;display:inline-block;line-height:0}
.logo svg{display:block;height:36px;width:auto}
.hero{margin:0 0 36px}
.hero h1{font:700 clamp(30px,6vw,46px)/1.12 'Miriam Libre',serif;color:var(--brand);margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;max-width:46ch;color:var(--ink2);font-size:17px}
.route{display:block;width:100%;max-width:360px;height:48px;margin-top:16px;overflow:visible}
h2{font:600 12.5px/1 Heebo;letter-spacing:.09em;color:var(--ink2);margin:36px 0 6px}
.hint{margin:0 0 14px;font-size:13.5px;color:var(--ink2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.demo{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:190px;border-radius:22px;padding:20px 20px 18px;color:#fff;text-decoration:none;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;background:var(--c)}
.demo::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 100% 0,rgba(255,255,255,.22),transparent 55%),linear-gradient(160deg,transparent 40%,rgba(0,0,0,.28));pointer-events:none}
.demo::after{content:"";position:absolute;inset:auto -20px -26px auto;width:150px;height:150px;border-radius:50%;border:2px dashed rgba(255,255,255,.28)}
.demo:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(23,53,42,.18)}
.stamp{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font:700 17px 'Miriam Libre',serif;background:rgba(255,255,255,.12)}
.demo .t{position:relative;z-index:1;font:700 26px/1.1 'Miriam Libre',serif;margin-top:16px}
.demo .s{position:relative;z-index:1;font-size:14px;opacity:.9;margin-top:4px}
.demo .open{position:relative;z-index:1;align-self:flex-start;margin-top:14px;font:600 13px Heebo;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 14px}
.tool{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.tool:hover{transform:translateY(-2px);border-color:var(--brand)}
.tool .ic{width:46px;height:46px;border-radius:13px;background:var(--brand);color:var(--btnink);display:flex;align-items:center;justify-content:center;flex:none}
.tool .ic svg{width:24px;height:24px}
.tool .tx{flex:1;min-width:0}.tool .t{font-weight:600;font-size:17px}.tool .s{font-size:13.5px;color:var(--ink2)}
.tool .go,.row .go{color:var(--ink2);font-size:18px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:inherit;transition:border-color .15s}
.row:hover{border-color:var(--brand)}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line));flex:none}
.row .tx{flex:1;min-width:0}.row .t{font-weight:600}.row .s{font-size:13px;color:var(--ink2)}
form{display:flex;flex-direction:column;gap:12px;margin-top:28px;max-width:420px}
.lock h1{font:700 clamp(28px,5vw,38px)/1.15 'Miriam Libre',serif;color:var(--brand);margin:30px 0 4px}
.lock p{margin:0;color:var(--ink2)}
input[type=password]{font:inherit;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
button.go-btn{font:600 16px Heebo,sans-serif;padding:15px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);cursor:pointer}
label.rem{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:14px}
#err{color:#c0392b;min-height:1.4em;font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px}
.qbtn{display:inline-flex;align-items:center;gap:9px;font:600 15px Heebo,sans-serif;text-decoration:none;border-radius:999px;padding:12px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.qbtn:hover{transform:translateY(-2px);border-color:var(--brand)}
.qbtn.main{background:var(--brand);color:var(--btnink);border-color:var(--brand)}
.qbtn svg{width:19px;height:19px}
.qbtn .live{width:8px;height:8px;border-radius:50%;background:#35c46b;box-shadow:0 0 0 0 rgba(53,196,107,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(53,196,107,0)}100%{box-shadow:0 0 0 0 rgba(53,196,107,0)}}
@media(prefers-reduced-motion:reduce){.qbtn .live{animation:none}}
.region{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.region>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 18px;cursor:pointer;font:600 17px Heebo,sans-serif;user-select:none}
.region>summary::-webkit-details-marker{display:none}
.region>summary .n{font:600 12.5px Heebo;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.region>summary .chev{margin-inline-start:auto;width:18px;height:18px;color:var(--ink2);transition:transform .2s}
.region[open]>summary .chev{transform:rotate(180deg)}
.region .trips{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trip{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:12px 18px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.trip:hover{background:var(--bg)}
.trip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line))}
.trip .t{font-weight:600}.trip .t .fam{font-weight:400;color:var(--ink2)}
.trip .d{font-size:13px;color:var(--ink2);direction:ltr;text-align:right;unicode-bidi:plaintext}
.trip .st{font:600 11.5px Heebo;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:1px}
.trip .st.now{background:#35c46b;color:#fff}.trip .st.done{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.trip .open{font:600 13px Heebo;color:var(--blue);white-space:nowrap}
.trip.past{opacity:.72}
.empty{padding:14px 18px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line)}
.foot{margin-top:46px;font-size:12.5px;color:var(--ink2)}
@media(max-width:560px){.top{margin-bottom:24px}.logo svg{height:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="logo" aria-label="Pack &amp; Board"><svg viewBox="0 0 1100 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pack &amp; Board"><text x="0" y="190" font-family="Miriam Libre,serif" font-weight="700" font-size="150" letter-spacing="-3" style="fill:var(--brand)">Pack</text><g transform="translate(374 14) scale(1.9)"><text x="48" y="100" text-anchor="middle" font-family="Miriam Libre,serif" font-weight="700" font-size="100" style="fill:var(--blue)">&amp;</text><path d="M72 44 L108 26 L92 62 L85 51 Z" style="fill:var(--brand)"/><path d="M85 51 L108 26" style="stroke:var(--bg)" stroke-width="2.6" stroke-linecap="round" fill="none"/></g><text x="625" y="190" font-family="Miriam Libre,serif" font-weight="700" font-size="150" letter-spacing="-3" style="fill:var(--brand)">Board</text></svg></span>
  </div>

  <div id="lock" class="lock">
    <h1>הכניסה פרטית</h1>
    <p id="sub">הכניסי סיסמה כדי להמשיך.</p>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="packandboard" autocomplete="username" hidden>
      <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="סיסמה" required>
      <label class="rem"><input type="checkbox" id="rem" checked> זכור במכשיר הזה</label>
      <div id="err" role="alert"></div>
      <button class="go-btn" type="submit">כניסה</button>
    </form>
  </div>
  <div id="out"></div>
</div>

    var key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
    return new TextDecoder().decode(plain);
  }
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function isExt(u){return /^https?:/.test(u);}
  function link(a,u){a.href=u;if(isExt(u)){a.target='_blank';a.rel='noopener';}return a;}
  function demoCard(i){
    var a=link(el('a','demo'),i[2]);a.style.setProperty('--c',i[3]||'#17352A');
    a.appendChild(el('span','stamp',i[4]||''));a.appendChild(el('span','t',i[0]));a.appendChild(el('span','s',i[1]));a.appendChild(el('span','open','פתיחה ←'));return a;
  }
  function toolCard(i){
    var a=link(el('a','tool'),i[2]);var ic=el('span','ic');ic.innerHTML=ICONS[i[4]]||ICONS.link;a.appendChild(ic);
    var tx=el('span','tx');tx.appendChild(el('div','t',i[0]));tx.appendChild(el('div','s',i[1]));a.appendChild(tx);a.appendChild(el('span','go','←'));return a;
  }
  function rowCard(i){
    var a=link(el('a','row'),i[2]);if(i[3])a.style.setProperty('--c',i[3]);a.appendChild(el('span','dot'));
    var tx=el('span','tx');tx.appendChild(el('div','t',i[0]));tx.appendChild(el('div','s',i[1]));a.appendChild(tx);a.appendChild(el('span','go','←'));return a;
  }
  var CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function regionBox(r){
    var det=el('details','region'), k='pab.hub.region.'+r.name;
    try{ if(localStorage.getItem(k)==='1') det.open=true; }catch(e){}
    det.addEventListener('toggle',function(){ try{ localStorage.setItem(k,det.open?'1':'0'); }catch(e){} });
    var sum=el('summary');sum.appendChild(el('span',null,r.name));sum.appendChild(el('span','n',String(r.items.length)));
    sum.insertAdjacentHTML('beforeend',CHEV);det.appendChild(sum);
    if(!r.items.length){det.appendChild(el('div','empty','עדיין אין כאן טיולים.'));return det;}
    var box=el('div','trips'), t=today();
    // upcoming and current first (by start date), finished trips at the end
    var items=r.items.slice().sort(function(a,b){var pa=a[6]<t, pb=b[6]<t; return pa!==pb ? (pa?1:-1) : (pa ? (a[5]<b[5]?1:-1) : (a[5]<b[5]?-1:1));});
    items.forEach(function(i){
      var a=link(el('a','trip'),i[3]);if(i[4])a.style.setProperty('--c',i[4]);
      a.appendChild(el('span','dot'));
      var tx=el('span');var tt=el('div','t',i[0]+' ');tt.appendChild(el('span','fam','· '+i[1]));
      if(i[5]&&i[5]<=t&&t<=i[6])tt.appendChild(el('span','st now','בטיול עכשיו'));
      else if(i[6]&&i[6]<t){tt.appendChild(el('span','st done','הסתיים'));a.classList.add('past');}
      tx.appendChild(tt);tx.appendChild(el('div','d',i[2]));a.appendChild(tx);
      a.appendChild(el('span','open','לאפליקציה ←'));box.appendChild(a);
    });
    det.appendChild(box);return det;
  }
  function render(groups){
    document.getElementById('lock').remove();
    var out=document.getElementById('out');
    var hero=el('div','hero');
    hero.appendChild(el('h1',null,'הטיול שלכם, מוכן ביד'));
    hero.appendChild(el('p',null,'אפליקציית ליווי אישית לכל טיול: יום אחר יום, מפות, הזמנות, מזג אוויר, מתרגם, בעברית ובאנגלית.'));
    hero.insertAdjacentHTML('beforeend','<svg class="route" viewBox="0 0 360 48" aria-hidden="true"><path d="M10 34 C70 2 120 46 180 28 S290 4 336 14" fill="none" stroke="var(--blue)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 9"/><circle cx="10" cy="34" r="6" fill="var(--blue)"/><circle cx="336" cy="14" r="6" fill="var(--blue)"/><g transform="translate(184 25) scale(.78) translate(-90 -44)"><path d="M72 44 L108 26 L92 62 L85 51 Z" style="fill:var(--brand)"/><path d="M85 51 L108 26" style="stroke:var(--bg)" stroke-width="2.6" stroke-linecap="round"/></g></svg>');
    out.appendChild(hero);
    var quick=el('div','quick');
    var GA='https://analytics.google.com/analytics/web/#/a406945886p552788304/';
    var q1=el('a','qbtn main');q1.href='/dana/analytics/';
    q1.insertAdjacentHTML('beforeend','<span class="live" aria-hidden="true"></span>');q1.appendChild(el('span',null,'אנליטיקס עכשיו'));
    var q2=el('a','qbtn');q2.href=GA+'reports/intelligenthome';q2.target='_blank';q2.rel='noopener';
    q2.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>');q2.appendChild(el('span',null,'דוח מלא'));
    quick.appendChild(q1);quick.appendChild(q2);
    out.appendChild(quick);
    groups.forEach(function(g){
      var sec=el('section');
      sec.appendChild(el('h2',null,g.title));
      if(g.hint)sec.appendChild(el('p','hint',g.hint));
      if(g.kind==='regions'){ g.regions.forEach(function(r){sec.appendChild(regionBox(r));}); out.appendChild(sec); return; }
      var box=el('div',g.kind==='hero'?'grid3':(g.kind==='tools'?'grid3':'list'));
      g.items.forEach(function(i){box.appendChild(g.kind==='hero'?demoCard(i):(g.kind==='tools'?toolCard(i):rowCard(i)));});
      sec.appendChild(box);out.appendChild(sec);
    });
    out.appendChild(el('p','foot','Pack & Board · אפליקציות טיול בנויות בשבילכם'));
  }
  async function unlock(pw,remember,silent){
    try{
      var g=await decrypt(pw);
      try{ if(remember) localStorage.setItem(KEY,pw);}catch(e){}
      if(MODE==='page'){ g=g.split("classList.add('present')").join('0'); document.open(); document.write(g); document.close(); } else { render(JSON.parse(g)); }
      return true;
    }catch(e){
      if(!silent) document.getElementById('err').textContent='הסיסמה לא נכונה.';
      try{localStorage.removeItem(KEY);}catch(x){}
      return false;
    }
  }
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault(); unlock(document.getElementById('pw').value,document.getElementById('rem').checked,false);
  });
  try{
    var hp=/[#&]p=([A-Za-z0-9_-]+)/.exec(location.hash||'');
    if(hp){ unlock(hp[1],true,true).then(function(ok){ if(!ok){ try{ var s=localStorage.getItem(KEY); if(s) unlock(s,true,true); }catch(e){} } }); }
    else { var saved=localStorage.getItem(KEY); if(saved) unlock(saved,true,true); }
  }catch(e){}
})();
